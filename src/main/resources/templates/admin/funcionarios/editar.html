
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="description" content="Editar funcionário da padaria Pão e Felicidade">

    <title>Editar Funcionário | Pão e Felicidade</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<!-- MENU -->
<div th:replace="~{fragments/menu :: menu}"></div>

<main class="container py-4">

    <!-- TÍTULO -->
    <div class="mb-4">
        <h1 class="h3">Editar Funcionário</h1>

        <p class="text-muted">
            Atualize as informações do funcionário cadastrado.
        </p>
    </div>

    <!-- MENSAGEM DE ERRO -->
    <div th:if="${erro}"
         class="alert alert-danger"
         th:text="${erro}">
    </div>

    <!-- FORMULÁRIO -->
    <div class="card shadow-sm">

        <div class="card-body p-4">

            <form th:action="@{/admin/funcionarios/editar/{id}(id=${id})}"
                  th:object="${funcionario}"
                  method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <!-- DADOS PESSOAIS -->
                <h5 class="mb-3">Dados pessoais</h5>

                <div class="row g-3">

                    <!-- NOME -->
                    <div class="col-md-6">
                        <label class="form-label">Nome completo *</label>

                        <input type="text"
                               th:field="*{nome}"
                               class="form-control"
                               maxlength="150"
                               required>
                    </div>

                    <!-- CPF -->
                    <div class="col-md-6">
                        <label class="form-label">CPF *</label>

                        <input type="text"
                               th:field="*{cpf}"
                               class="form-control"
                               maxlength="14"
                               required>
                    </div>

                    <!-- TELEFONE -->
                    <div class="col-md-6">
                        <label class="form-label">Telefone *</label>

                        <input type="tel"
                               th:field="*{telefone}"
                               class="form-control"
                               maxlength="20"
                               required>
                    </div>

                    <!-- CARGO -->
                    <div class="col-md-6">
                        <label class="form-label">Cargo *</label>

                        <select th:field="*{cargo}"
                                class="form-select"
                                required>

                            <option value="">Selecione o cargo</option>

                            <option th:each="cargo : ${cargos}"
                                    th:value="${cargo}"
                                    th:text="${cargo.descricao}">
                            </option>

                        </select>
                    </div>

                    <!-- DATA DE ADMISSÃO -->
                    <div class="col-md-6">
                        <label class="form-label">Data de admissão *</label>
                        <input type="date"
                               id="dataAdmissao"
                               name="dataAdmissao"
                               th:value="${#temporals.format(funcionario.dataAdmissao, 'yyyy-MM-dd')}"
                               class="form-control"
                               required>
                    </div>

                </div>

                <hr class="my-4">

                <!-- DADOS DE ACESSO -->
                <h5 class="mb-3">Dados de acesso</h5>

                <div class="row g-3">

                    <!-- EMAIL -->
                    <div class="col-md-6">
                        <label class="form-label">E-mail *</label>

                        <input type="email"
                               th:field="*{email}"
                               class="form-control"
                               maxlength="150"
                               required>
                    </div>

                    <!-- SENHA -->
                    <div class="col-md-6">
                        <label class="form-label">Nova senha</label>

                        <input type="password"
                               th:field="*{senha}"
                               class="form-control"
                               minlength="8"
                               placeholder="Digite somente se desejar alterar">

                        <small class="text-muted">
                            Deixe em branco para manter a senha atual.
                            Se alterar, utilize pelo menos 8 caracteres.
                        </small>
                    </div>

                </div>

                <hr class="my-4">

                <!-- BOTÕES -->
                <div class="d-flex gap-2 flex-wrap">

                    <button type="submit" class="btn btn-primary">
                        Salvar alterações
                    </button>

                    <a th:href="@{/admin/funcionarios}"
                       class="btn btn-outline-secondary">
                        Cancelar
                    </a>

                </div>

            </form>

        </div>
    </div>

</main>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/bootstrap/bootstrap.bundle.min.js}"></script>

</body>
</html>
