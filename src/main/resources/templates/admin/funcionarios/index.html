
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Funcionários | Pão e Felicidade</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<div th:replace="~{fragments/menu :: menu}"></div>

<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
        <div>
            <h1 class="h3">Funcionários</h1>
            <p class="text-muted">
                Consulte e gerencie os funcionários da padaria.
            </p>
        </div>

        <a th:href="@{/admin/funcionarios/novo}"
           class="btn btn-primary">
            + Adicionar funcionário
        </a>
    </div>

    <div th:if="${sucesso}" class="alert alert-success"
         th:text="${sucesso}"></div>

    <div th:if="${erro}" class="alert alert-danger"
         th:text="${erro}"></div>

    <!-- PESQUISA -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">

            <form th:action="@{/admin/funcionarios}"
                  method="get"
                  class="row g-2">

                <div class="col-md-9">
                    <input type="text"
                           name="busca"
                           class="form-control"
                           placeholder="Pesquisar por nome, CPF ou cargo..."
                           th:value="${busca}">
                </div>

                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary w-100">
                        Pesquisar
                    </button>

                    <a th:href="@{/admin/funcionarios}"
                       class="btn btn-outline-secondary">
                        Limpar
                    </a>
                </div>

            </form>

        </div>
    </div>

    <!-- LISTAGEM -->
    <div class="card shadow-sm">
        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Cargo</th>
                        <th>Telefone</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="funcionario : ${funcionarios}">

                        <td th:text="${funcionario.id}"></td>

                        <td th:text="${funcionario.nome}"></td>

                        <td th:text="${funcionario.cpf}"></td>

                        <td th:text="${funcionario.cargo}"></td>

                        <td th:text="${funcionario.telefone}"></td>

                        <td>
                                <span th:if="${funcionario.ativo}"
                                      class="badge bg-success">
                                    Ativo
                                </span>

                            <span th:unless="${funcionario.ativo}"
                                  class="badge bg-danger">
                                    Inativo
                                </span>
                        </td>

                        <td>
                            <div class="d-flex flex-wrap gap-1">

                                <!-- DETALHES -->
                                <a th:href="@{/admin/funcionarios/detalhes/{id}(id=${funcionario.id})}"
                                   class="btn btn-sm btn-info">
                                    Detalhes
                                </a>

                                <!-- EDITAR -->
                                <a th:href="@{/admin/funcionarios/editar/{id}(id=${funcionario.id})}"
                                   class="btn btn-sm btn-warning">
                                    Editar
                                </a>

                                <!-- DESATIVAR -->
                                <form th:if="${funcionario.ativo}"
                                      th:action="@{/admin/funcionarios/desativar/{id}(id=${funcionario.id})}"
                                      method="post">

                                    <input type="hidden"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}">

                                    <button type="submit"
                                            class="btn btn-sm btn-danger"
                                            onclick="return confirm('Deseja desativar este funcionário?')">
                                        Inativar
                                    </button>
                                </form>

                                <!-- REATIVAR -->
                                <form th:unless="${funcionario.ativo}"
                                      th:action="@{/admin/funcionarios/reativar/{id}(id=${funcionario.id})}"
                                      method="post">

                                    <input type="hidden"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}">

                                    <button type="submit"
                                            class="btn btn-sm btn-success">
                                        Reativar
                                    </button>
                                </form>

                            </div>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(funcionarios)}">
                        <td colspan="7" class="text-center text-muted py-4">
                            Nenhum funcionário encontrado.
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>
        </div>
    </div>

    <div class="mt-4">
        <a th:href="@{/dashboard}"
           class="btn btn-outline-secondary">
            Voltar ao Dashboard
        </a>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/bootstrap/bootstrap.bundle.min.js}"></script>

</body>
</html>
