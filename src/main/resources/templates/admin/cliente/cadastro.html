
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Cadastro de Cliente | Pão e Felicidade</title>

    <link rel="stylesheet"
          th:href="@{/css/bootstrap/bootstrap.min.css}">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<!-- MENU -->
<div th:replace="~{fragments/menu :: menu}"></div>

<main class="container py-5">

    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">

            <div class="card border-0 shadow-sm">

                <div class="card-header bg-dark text-white p-4">
                    <h1 class="h4 mb-1">Criar minha conta</h1>
                    <p class="mb-0">
                        Cadastre-se para aproveitar nossos produtos e serviços.
                    </p>
                </div>

                <div class="card-body p-4">

                    <!-- ERRO -->
                    <div th:if="${erro != null}"
                         class="alert alert-danger"
                         role="alert"
                         th:text="${erro}">
                    </div>

                    <!-- FORMULÁRIO -->
                    <form th:action="@{/cliente/cadastro}"
                          th:object="${cliente}"
                          method="post">

                        <h2 class="h5 mb-3">Dados pessoais</h2>

                        <div class="row g-3">

                            <div class="col-12">
                                <label class="form-label">Nome completo *</label>
                                <input type="text"
                                       th:field="*{nome}"
                                       class="form-control"
                                       maxlength="150"
                                       required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">CPF *</label>
                                <input type="text"
                                       th:field="*{cpf}"
                                       class="form-control"
                                       maxlength="14"
                                       placeholder="000.000.000-00"
                                       inputmode="numeric"
                                       required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Telefone *</label>
                                <input type="tel"
                                       th:field="*{telefone}"
                                       class="form-control"
                                       maxlength="20"
                                       placeholder="(00) 00000-0000"
                                       required>
                            </div>

                        </div>

                        <hr class="my-4">

                        <h2 class="h5 mb-3">Dados de acesso</h2>

                        <div class="row g-3">

                            <div class="col-12">
                                <label class="form-label">E-mail *</label>
                                <input type="email"
                                       th:field="*{email}"
                                       class="form-control"
                                       maxlength="150"
                                       required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Senha *</label>
                                <input type="password"
                                       th:field="*{senha}"
                                       class="form-control"
                                       minlength="8"
                                       required>
                                <small class="text-muted">
                                    Mínimo de 8 caracteres.
                                </small>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Confirmar senha *</label>
                                <input type="password"
                                       th:field="*{confirmarSenha}"
                                       class="form-control"
                                       minlength="8"
                                       required>
                            </div>

                        </div>

                        <!-- AÇÕES -->
                        <div class="d-flex flex-wrap gap-2
                                    justify-content-end mt-4">

                            <a th:href="@{/login}"
                               class="btn btn-outline-secondary">
                                Já tenho conta
                            </a>

                            <button type="submit"
                                    class="btn btn-primary">
                                Criar conta
                            </button>

                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>

</main>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/bootstrap/bootstrap.bundle.min.js}"></script>

</body>
</html>
