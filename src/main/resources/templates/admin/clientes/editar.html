
<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Editar Cliente | Pão & Felicidade</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow-sm mx-auto" style="max-width: 650px;">

        <div class="card-header bg-dark text-white p-3">
            <h4 class="mb-0">Editar Cliente</h4>
        </div>

        <div class="card-body p-4">

            <div th:if="${erro}"
                 class="alert alert-danger"
                 th:text="${erro}">
            </div>

            <form th:action="@{/admin/clientes/atualizar/{id}(id=${idCliente})}"
                  th:object="${cliente}"
                  method="post">

                <div class="mb-3">
                    <label class="form-label">Nome completo</label>

                    <input type="text"
                           th:field="*{nome}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">CPF</label>

                    <input type="text"
                           th:field="*{cpf}"
                           class="form-control"
                           maxlength="14"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Telefone</label>

                    <input type="text"
                           th:field="*{telefone}"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">E-mail</label>

                    <input type="email"
                           th:field="*{email}"
                           class="form-control"
                           required>
                </div>

                <div class="alert alert-info">
                    A senha atual do cliente será mantida.
                    Para alterar a senha, será necessário utilizar
                    a funcionalidade de alteração de senha.
                </div>

                <div class="d-flex justify-content-between">

                    <a th:href="@{/admin/clientes}"
                       class="btn btn-secondary">
                        Voltar
                    </a>

                    <button type="submit"
                            class="btn btn-success">
                        Salvar alterações
                    </button>

                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
