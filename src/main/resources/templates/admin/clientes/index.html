<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>
        <!DOCTYPE html>
        <html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

        <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>Gerenciar Clientes | Pão & Felicidade</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<div th:replace="~{fragments/menu :: menu}"></div>

<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">

        <div>
            <h2>Gerenciamento de Clientes</h2>
            <p class="text-muted mb-0">
                Consulte e gerencie os clientes da padaria.
            </p>
        </div>

        <a th:href="@{/admin/clientes/novo}"
           class="btn btn-primary">
            + Cadastrar cliente
        </a>

    </div>

    <!-- MENSAGEM DE SUCESSO -->
    <div th:if="${sucesso}"
         class="alert alert-success"
         th:text="${sucesso}">
    </div>

    <!-- PESQUISA -->
    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <form th:action="@{/admin/clientes}"
                  method="get"
                  class="row g-2">

                <div class="col-md-9">

                    <input type="text"
                           name="busca"
                           class="form-control"
                           placeholder="Pesquisar por nome, CPF, telefone ou e-mail"
                           th:value="${busca}">

                </div>

                <div class="col-md-3 d-flex gap-2">

                    <button type="submit"
                            class="btn btn-primary w-100">
                        Pesquisar
                    </button>

                    <a th:href="@{/admin/clientes}"
                       class="btn btn-outline-secondary">
                        Limpar
                    </a>

                </div>

            </form>

        </div>

    </div>

    <!-- TABELA DE CLIENTES -->
    <div class="card shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Telefone</th>
                        <th>E-mail</th>
                        <th>Situação</th>
                        <th>Ações</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="cliente : ${clientes}">

                        <td th:text="${cliente.id}"></td>

                        <td th:text="${cliente.nome}"></td>

                        <td th:text="${cliente.cpf}"></td>

                        <td th:text="${cliente.telefone}"></td>

                        <td th:text="${cliente.usuario.email}"></td>

                        <td>
                            <span th:if="${cliente.ativo}" class="badge bg-success">
                                Ativo
                            </span>
                            <span th:unless="${cliente.ativo}"  class="badge bg-secondary">
                                Inativo
                            </span>
                        </td>
                        <td>
                            <div class="d-flex gap-2">

                                <a th:href="@{/admin/clientes/editar/{id}(id=${cliente.id})}"
                                   class="btn btn-warning btn-sm">
                                    Editar
                                </a>

                                <form th:action="@{/admin/clientes/status/{id}(id=${cliente.id})}"
                                      method="post">

                                    <button type="submit"
                                            class="btn btn-sm"
                                            th:classappend="${cliente.ativo} ? ' btn-danger' : ' btn-success'"
                                            th:text="${cliente.ativo} ? 'Inativar' : 'Reativar'"
                                            onclick="return confirm('Deseja realmente alterar o status deste cliente?')">
                                    </button>

                                </form>

                            </div>
                        </td>


                    </tr>

                    <tr th:if="${#lists.isEmpty(clientes)}">

                        <td colspan="6"
                            class="text-center text-muted py-4">
                            Nenhum cliente encontrado.
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

            <p class="text-muted mb-0">
                Total de clientes encontrados:
                <strong th:text="${#lists.size(clientes)}"></strong>
            </p>

        </div>

    </div>

    <div class="mt-3">
        <a th:href="@{/dashboard}"
           class="btn btn-outline-secondary">
            Voltar ao painel
        </a>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/bootstrap/bootstrap.bundle.min.js}"></script>

</body>
</html>
</title>
</head>
<body>


</body>
</html>
