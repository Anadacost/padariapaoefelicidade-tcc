<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Página Modelo para os conteúdos das demais páginas do sistema">
    <meta name="keywords" content="Modelo, Bootstrap, Sistema">
    <meta name="author" content="SEU NOME">
    <title>DashBoard do Sistema</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
    <link rel="stylesheet" th:href="@{/css/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<!-- MENU -->
<div th:replace="~{fragments/menu :: menu}"></div>

<!-- =========================================================
     2. CONTAINER PRINCIPAL
     ========================================================= -->
<main class="container py-4">

    <!-- GERENCIAMENTO -->
    <div class="row g-3">

        <!-- GERENCIAMENTO DE FUNCIONÁRIOS -->
        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title">Funcionários</h5>

                    <p class="card-text text-muted">
                        Cadastre, consulte e gerencie os funcionários da padaria.
                    </p>

                    <a th:href="@{/admin/funcionarios}"
                       class="btn btn-primary">
                        Gerenciar funcionários
                    </a>
                </div>
            </div>
        </div>

        <!-- GERENCIAMENTO DE PRODUTOS -->
        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title">Produtos</h5>

                    <p class="card-text text-muted">
                        Cadastre, consulte, edite e gerencie os produtos da loja.
                    </p>

                    <a th:href="@{/produtos}"
                       class="btn btn-primary">
                        Gerenciar produtos
                    </a>
                </div>
            </div>
        </div>

        <!-- GERENCIAMENTO DE CLIENTES -->
        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">

                    <h5 class="card-title">Clientes</h5>

                    <p class="card-text text-muted">
                        Consulte, cadastre e gerencie os clientes
                        da padaria.
                    </p>

                    <a th:href="@{/admin/clientes}"
                       class="btn btn-primary">
                        Gerenciar clientes
                    </a>

                </div>
            </div>
        </div>
    </div>
</main>
<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/bootstrap/bootstrap.bundle.min.js}"></script>

</body>
</html>
