
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Produto | Pão e Felicidade</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow-sm mx-auto" style="max-width: 750px;">

        <div class="card-header bg-dark text-white">
            <h3 class="mb-0">Editar Produto</h3>
        </div>

        <div class="card-body p-4">

            <div th:if="${erro}" class="alert alert-danger"
                 th:text="${erro}"></div>

            <form th:action="@{/produtos/atualizar/{id}(id=${produto.id})}"
                  th:object="${produto}"
                  method="post"
                  enctype="multipart/form-data">

                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{imagem}">

                <div class="mb-3">
                    <label class="form-label">Nome do produto</label>
                    <input type="text" class="form-control"
                           th:field="*{nome}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Categoria</label>
                    <input type="text" class="form-control"
                           th:field="*{categoria}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Descrição</label>
                    <textarea class="form-control" rows="3"
                              th:field="*{descricao}"></textarea>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Preço (R$)</label>
                        <input type="number" class="form-control"
                               th:field="*{preco}"
                               step="0.01" min="0.01" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Quantidade em estoque</label>
                        <input type="number" class="form-control"
                               th:field="*{quantidadeEstoque}"
                               min="0" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Status do produto</label>

                        <select class="form-select" th:field="*{ativo}">
                            <option value="true">Ativo</option>
                            <option value="false">Inativo</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Imagem atual</label>

                    <div th:if="${produto.imagem != null and !produto.imagem.isEmpty()}">
                        <img th:src="@{${produto.imagem}}"
                             alt="Imagem atual do produto"
                             class="img-thumbnail mb-3"
                             style="max-height: 180px;">
                    </div>

                    <div th:if="${produto.imagem == null or produto.imagem.isEmpty()}"
                         class="text-muted mb-3">
                        Nenhuma imagem cadastrada.
                    </div>

                    <label class="form-label">Trocar imagem</label>
                    <input type="file"
                           class="form-control"
                           name="arquivoImagem"
                           accept="image/png, image/jpeg, image/webp">

                    <small class="text-muted">
                        Se não selecionar outra imagem, a imagem atual será mantida.
                    </small>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-success">
                        Salvar alterações
                    </button>

                    <a th:href="@{/produtos}" class="btn btn-secondary">
                        Voltar
                    </a>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
