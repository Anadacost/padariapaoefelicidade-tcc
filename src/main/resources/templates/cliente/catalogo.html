
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Catálogo | Pão & Felicidade</title>

    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
    <link rel="stylesheet" th:href="@{/css/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<div th:replace="~{fragments/menu :: menu}"></div>

<main class="container py-5">

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">

        <div>
            <h1 class="fw-bold">Nosso catálogo</h1>
            <p class="text-muted mb-0">
                Confira os produtos disponíveis em nossa padaria.
            </p>
        </div>

        <a th:href="@{/cliente/painel}"
           class="btn btn-outline-secondary">
            Voltar ao painel
        </a>

    </div>

    <div class="row g-3">

        <div class="col-md-6 col-lg-4"
             th:each="produto : ${produtos}">

            <div class="card h-100 shadow-sm">

                <!-- IMAGEM DO PRODUTO -->
                <img th:if="${produto.imagem != null and !produto.imagem.isEmpty()}"
                     th:src="${produto.imagem}"
                     th:alt="${produto.nome}"
                     class="card-img-top"
                     style="height: 220px; object-fit: cover;">

                <div th:if="${produto.imagem == null or produto.imagem.isEmpty()}"
                     class="bg-light text-muted text-center py-5">
                    Imagem não disponível
                </div>

                <div class="ratio ratio-4x3"
                     th:if="${produto.imagem != null and !produto.imagem.isEmpty()}">

                    <img th:src="${produto.imagem}"
                         th:alt="${produto.nome}"
                         class="w-100 h-100 object-fit-cover">
                </div>

                <div th:if="${produto.imagem == null or produto.imagem.isEmpty()}"
                     class="text-center text-muted py-3">
                    Imagem não cadastrada
                </div>


                <div class="card-body">


                    <h5 class="card-title fw-bold"
                        th:text="${produto.nome}">
                    </h5>

                    <p class="text-muted mb-2"
                       th:text="${produto.categoria}">
                    </p>

                    <p class="card-text"
                       th:text="${produto.descricao}">
                    </p>

                    <h5 class="text-success fw-bold"
                        th:text="${#numbers.formatCurrency(produto.preco)}">
                    </h5>

                    <div class="mt-3">

                        <span th:if="${produto.quantidadeEstoque > 0}"
                              class="badge bg-success">
                            Disponível
                        </span>

                        <span th:unless="${produto.quantidadeEstoque > 0}"
                              class="badge bg-secondary">
                            Esgotado
                        </span>

                    </div>

                </div>

            </div>

        </div>

        <div th:if="${#lists.isEmpty(produtos)}"
             class="col-12">

            <div class="alert alert-info text-center">
                No momento, não temos produtos disponíveis.
            </div>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/bootstrap/bootstrap.bundle.min.js}"></script>

</body>
</html>
