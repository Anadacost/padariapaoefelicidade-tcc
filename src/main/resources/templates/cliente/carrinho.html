
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Meu Carrinho | Pão & Felicidade</title>

    <link rel="stylesheet"
          th:href="@{/css/bootstrap/bootstrap.min.css}">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/menu :: menu}"></div>

<main class="container py-5">

    <div class="mb-4">
        <h1 class="fw-bold">Meu Carrinho</h1>
        <p class="text-muted">
            Confira seus produtos antes de finalizar o pedido.
        </p>
    </div>

    <!-- Mensagens -->
    <div th:if="${sucesso}"
         class="alert alert-success"
         th:text="${sucesso}">
    </div>

    <div th:if="${erro}"
         class="alert alert-danger"
         th:text="${erro}">
    </div>

    <!-- Carrinho vazio -->
    <div th:if="${carrinho.itens == null or carrinho.itens.isEmpty()}"
         class="text-center py-5">

        <h3>Seu carrinho está vazio!</h3>

        <p class="text-muted">
            Que tal escolher algumas delícias do nosso cardápio?
        </p>

        <a th:href="@{/cardapio}"
           class="btn btn-primary mt-3">
            Ver cardápio
        </a>

    </div>

    <!-- Carrinho com produtos -->
    <div th:unless="${carrinho.itens == null or carrinho.itens.isEmpty()}">

        <div class="row g-4">

            <!-- Lista de produtos -->
            <div class="col-lg-8">

                <div class="card mb-3"
                     th:each="item : ${carrinho.itens}">

                    <div class="card-body">

                        <div class="row align-items-center g-3">

                            <!-- Imagem -->
                            <div class="col-4 col-md-3">

                                <img th:if="${item.produto.imagem != null and !item.produto.imagem.isEmpty()}"
                                     th:src="${item.produto.imagem}"
                                     th:alt="${item.produto.nome}"
                                     class="img-fluid rounded">

                                <div th:if="${item.produto.imagem == null or item.produto.imagem.isEmpty()}"
                                     class="bg-light text-muted text-center rounded p-3">
                                    Sem imagem
                                </div>

                            </div>

                            <!-- Informações -->
                            <div class="col-8 col-md-9">

                                <h5 class="fw-bold"
                                    th:text="${item.produto.nome}">
                                </h5>

                                <p class="text-muted mb-2"
                                   th:text="${item.produto.categoria}">
                                </p>

                                <p class="mb-2">
                                    Preço unitário:
                                    <strong>
                                        R$
                                        <span th:text="${#numbers.formatDecimal(item.produto.preco, 1, 'POINT', 2, 'COMMA')}"></span>
                                    </strong>
                                </p>

                                <!-- Quantidade -->
                                <form th:action="@{/cliente/carrinho/atualizar/{id}(id=${item.id})}"
                                      method="post"
                                      class="d-flex align-items-center gap-2 mb-2">

                                    <label class="form-label mb-0">
                                        Quantidade:
                                    </label>

                                    <input type="number"
                                           name="quantidade"
                                           min="1"
                                           th:value="${item.quantidade}"
                                           class="form-control"
                                           style="max-width: 90px"
                                           required>

                                    <button type="submit"
                                            class="btn btn-outline-primary btn-sm">
                                        Atualizar
                                    </button>

                                </form>

                                <!-- Subtotal -->
                                <p class="mb-2">
                                    Subtotal:
                                    <strong>
                                        R$
                                        <span th:text="${#numbers.formatDecimal(subtotais.get(item.id), 1, 'POINT', 2, 'COMMA')}"></span>
                                    </strong>
                                </p>

                                <!-- Remover -->
                                <form th:action="@{/cliente/carrinho/remover/{id}(id=${item.id})}"
                                      method="post">

                                    <button type="submit"
                                            class="btn btn-outline-danger btn-sm">
                                        Remover produto
                                    </button>

                                </form>

                            </div>

                        </div>

                    </div>

                </div>

                <a th:href="@{/cardapio}"
                   class="btn btn-outline-secondary">
                    Continuar comprando
                </a>

            </div>

            <!-- Resumo da compra -->
            <div class="col-lg-4">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h4 class="fw-bold mb-4">
                            Resumo do pedido
                        </h4>

                        <div class="d-flex justify-content-between mb-3">
                            <span>Quantidade de itens:</span>

                            <strong th:text="${#aggregates.sum(carrinho.itens.![quantidade])}">
                            </strong>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between mb-4">

                            <h5>Total:</h5>

                            <h5 class="fw-bold text-success">
                                R$
                                <span th:text="${#numbers.formatDecimal(total, 1, 'POINT', 2, 'COMMA')}"></span>
                            </h5>

                        </div>

                        <a th:href="@{/cliente/checkout}"
                           class="btn btn-success w-100">
                            Continuar para finalizar
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
