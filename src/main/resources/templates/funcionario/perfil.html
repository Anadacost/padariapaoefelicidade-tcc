
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Meu Perfil | Pão e Felicidade</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<div th:replace="~{fragments/menu :: menu}"></div>

<main class="container py-5">

    <!-- CABEÇALHO -->
    <div class="mb-4">
        <h2 class="fw-bold">Meu perfil</h2>
        <p class="text-muted">
            Consulte seus dados e atualize suas informações pessoais.
        </p>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-md-5">

            <!-- MENSAGENS -->
            <div class="alert alert-success"
                 th:if="${sucesso}"
                 th:text="${sucesso}">
            </div>

            <div class="alert alert-danger"
                 th:if="${erro}"
                 th:text="${erro}">
            </div>

            <form th:action="@{/funcionario/perfil}"
                  th:object="${funcionario}"
                  method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <h5 class="fw-bold mb-3">Informações pessoais</h5>

                <div class="row g-3">

                    <!-- NOME -->
                    <div class="col-md-6">
                        <label class="form-label">Nome completo</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{nome}"
                               required>
                    </div>

                    <!-- EMAIL -->
                    <div class="col-md-6">
                        <label class="form-label">E-mail</label>
                        <input type="email"
                               class="form-control"
                               name="email"
                               th:value="${email}"
                               required>
                    </div>

                    <!-- CPF:  -->
                    <div class="col-md-6">
                        <label class="form-label">CPF</label>
                        <div class="form-control bg-light"
                             th:text="${funcionario.cpf}">
                        </div>
                    </div>

                    <!-- TELEFONE -->
                    <div class="col-md-6">
                        <label class="form-label">Telefone</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{telefone}">
                    </div>

                </div>

                <hr class="my-4">

                <h5 class="fw-bold mb-3">Informações profissionais</h5>

                <div class="row g-3">

                    <!-- CARGO: SOMENTE VISUALIZAÇÃO -->
                    <div class="col-md-6">
                        <label class="form-label">Cargo</label>
                        <div class="form-control bg-light"
                             th:text="${funcionario.cargo.descricao}">
                        </div>
                    </div>

                    <!-- DATA DE ADMISSÃO -->
                    <div class="col-md-6">
                        <label class="form-label">Data de admissão</label>
                        <div class="form-control bg-light"
                             th:text="${#temporals.format(funcionario.dataAdmissao, 'dd/MM/yyyy')}">
                        </div>
                    </div>

                </div>

                <hr class="my-4">

                <!-- BOTÕES -->
                <div class="d-flex gap-2 flex-wrap">
                    <button type="submit" class="btn btn-primary">
                        Salvar alterações
                    </button>

                    <a th:href="@{/funcionario/painel}"
                       class="btn btn-outline-secondary">
                        Voltar
                    </a>
                </div>

            </form>

        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/bootstrap/bootstrap.bundle.min.js}"></script>

</body>
</html>
