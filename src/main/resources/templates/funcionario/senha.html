
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Alterar Senha | Pão e Felicidade</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<div th:replace="~{fragments/menu :: menu}"></div>

<main class="container py-4">

    <div class="mb-4">
        <h2 class="fw-bold">Alterar senha</h2>
        <p class="text-muted">
            Mantenha sua conta segura atualizando sua senha.
        </p>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">

            <!-- MENSAGEM DE SUCESSO -->
            <div class="alert alert-success"
                 th:if="${sucesso}"
                 th:text="${sucesso}">
            </div>

            <!-- MENSAGEM DE ERRO -->
            <div class="alert alert-danger"
                 th:if="${erro}"
                 th:text="${erro}">
            </div>

            <form th:action="@{/funcionario/senha}"
                  th:object="${alterarSenhaForm}"
                  method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="mb-3">
                    <label class="form-label">Senha atual</label>
                    <input type="password"
                           class="form-control"
                           th:field="*{senhaAtual}"
                           placeholder="Digite sua senha atual"
                           autocomplete="current-password"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nova senha</label>
                    <input type="password"
                           class="form-control"
                           th:field="*{novaSenha}"
                           placeholder="Digite sua nova senha"
                           minlength="8"
                           autocomplete="new-password"
                           required>
                    <small class="text-muted">
                        A senha deve possuir pelo menos 8 caracteres.
                    </small>
                </div>

                <div class="mb-4">
                    <label class="form-label">Confirmar nova senha</label>
                    <input type="password"
                           class="form-control"
                           th:field="*{confirmarSenha}"
                           placeholder="Digite novamente sua nova senha"
                           minlength="8"
                           autocomplete="new-password"
                           required>
                </div>

                <div class="d-flex gap-2 flex-wrap">

                    <button type="submit" class="btn btn-primary">
                        Alterar senha
                    </button>

                    <a th:href="@{/funcionario/painel}"
                       class="btn btn-outline-secondary">
                        Voltar
                    </a>

                </div>

            </form>

        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/bootstrap/bootstrap.bundle.min.js}"></script>

</body>
</html>
